# Generate the Xcode project with:  xcodegen generate
name: HallakAdmin
options:
  bundleIdPrefix: online.hallak
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.10.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
targets:
  HallakAdmin:
    type: application
    platform: iOS
    sources:
      - path: HallakAdmin
    info:
      path: HallakAdmin/Info.plist
      properties:
        CFBundleDisplayName: Hallak Admin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: en
        CFBundleLocalizations: [en, ar]
        CFBundleAllowMixedLocalizations: true
        UILaunchScreen:
          UIColorName: Cream
          UIImageName: LaunchLogo
          UIImageRespectsSafeAreaInsets: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        NSFaceIDUsageDescription: Face ID keeps the Hallak admin app locked when you are not using it.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        PRODUCT_NAME: HallakAdmin
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
      configs:
        Release:
          # Demo answers (HallakAdmin/DemoData) are for Debug screenshots only.
          EXCLUDED_SOURCE_FILE_NAMES: "*.json"
    scheme:
      testTargets:
        - HallakAdminTests
      gatherCoverageData: true
  HallakAdminTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: HallakAdminTests
    dependencies:
      - target: HallakAdmin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tests
        GENERATE_INFOPLIST_FILE: YES
        DEVELOPMENT_TEAM: $(APPLE_TEAM_ID)
