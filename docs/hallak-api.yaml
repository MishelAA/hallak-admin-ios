openapi: 3.1.0
info:
  title: Hallak admin API
  version: 1.2.0
  description: 'Private API for the Hallak super-admin iPhone app (plugin salon-manager-api). 1.0 reads, 1.1 adds one-time sign-in links, 1.2
    adds changes (create / change / delete salons, features, logins, billing, demo requests), done exactly like wp-admin and logged as "(iPhone
    app)". Login: HTTP Basic with your WordPress username and an Application Password, over HTTPS. Only administrators are allowed. Times are
    Lebanon time (Asia/Beirut). Lists: page / per_page (max 100). Every answer has generated_at and tz. GET answers send an ETag: send it back
    in If-None-Match to get 304 when nothing changed. Limits: 120 requests per minute; 10 wrong passwords from one address lock it for 15 minutes
    (429).'
servers:
- url: https://hallak.online/wp-json/hallak/v1
  description: Live
security:
- appPassword: []
tags:
- name: Connection
- name: Home
- name: Salons
- name: Billing
- name: Requests
- name: More
paths:
  /admin/ping:
    get:
      tags:
      - Connection
      summary: Test the login
      description: Use it on the first-launch screen. A 401 with code `smapi_no_auth_header` means the server removes the Authorization header
        (fix in wp-admin → Salons → iPhone app (API)).
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                  user:
                    type: string
                  site:
                    type: string
                  wordpress:
                    type: string
                  hallak_core:
                    type: string
                  api:
                    type: string
                    example: 1.0.0
                  https:
                    type: boolean
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/me:
    get:
      tags:
      - Connection
      summary: You and the site
      description: Your profile, language, what you can do, and which Hallak plugins are active (hide screens whose plugin is off).
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/UserShort'
                  language:
                    type: string
                    enum:
                    - en
                    - ar
                  can:
                    type: object
                    properties:
                      read:
                        type: boolean
                      write:
                        type: boolean
                        description: 'true from API 1.2: create / change / delete'
                      open_links:
                        type: boolean
                        description: 'true from API 1.1: POST /admin/login-link is available'
                  site:
                    type: object
                    properties:
                      name:
                        type: string
                      url:
                        type: string
                      wordpress:
                        type: string
                      hallak_core:
                        type: string
                      api:
                        type: string
                      plugins:
                        type: object
                        properties:
                          billing:
                            type: boolean
                          site:
                            type: boolean
                          whatsapp:
                            type: boolean
                          ai:
                            type: boolean
                          check:
                            type: boolean
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/overview:
    get:
      tags:
      - Home
      summary: Home screen numbers
      description: Salons by status and billing, money (MRR, paid this month, unpaid), new demo requests, WhatsApp and AI this month, plugin problems.
        Sections are missing when their plugin is not active.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Overview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/health:
    get:
      tags:
      - Home
      summary: Plugins check
      description: 'The Hallak check report: each plugin, installed and latest version, and the problems with how to fix them.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  available:
                    type: boolean
                  check_version:
                    type: string
                  environment:
                    type: object
                    additionalProperties:
                      type: string
                  plugins:
                    type: array
                    items:
                      type: object
                      properties:
                        number:
                          type: integer
                        folder:
                          type: string
                        name:
                          type: string
                        installed:
                          type:
                          - string
                          - 'null'
                        latest:
                          type:
                          - string
                          - 'null'
                        active:
                          type: boolean
                        up_to_date:
                          type:
                          - boolean
                          - 'null'
                  problems:
                    type: array
                    items:
                      type: object
                      properties:
                        level:
                          type: string
                          enum:
                          - error
                          - warn
                          - info
                        text:
                          type: string
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/activity:
    get:
      tags:
      - Home
      summary: Activity log (all salons)
      description: Newest first.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: salon_id
        in: query
        required: false
        schema:
          type: integer
        description: Only this salon.
      - name: type
        in: query
        required: false
        schema:
          type: string
        description: 'Object type: appointment, visit, customer, billing…'
      - name: action
        in: query
        required: false
        schema:
          type: string
        description: Exact action, e.g. appointment_online.
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date
        description: From this day.
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date
        description: Until this day.
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Text in the summary.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Items per page (max 100).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Activity'
                  page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 4
                  pages:
                    type: integer
                    example: 1
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/features:
    get:
      tags:
      - Salons
      summary: Features that can be switched on/off
      description: '`default: false` = optional feature, off until switched on for a salon.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        slug:
                          type: string
                        label:
                          type: string
                        help:
                          type: string
                        default:
                          type: boolean
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
  /admin/salons:
    get:
      tags:
      - Salons
      summary: List of salons
      description: Search looks in name, slug, phone (digits), address, owner login, email and name.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Text or phone digits.
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - active
          - suspended
        description: Account status.
      - name: billing
        in: query
        required: false
        schema:
          type: string
          enum:
          - free
          - trial
          - active
          - grace
          - overdue
        description: Billing status.
      - name: owner_id
        in: query
        required: false
        schema:
          type: integer
        description: Salons of one owner (branches).
      - name: sort
        in: query
        required: false
        schema:
          type: string
          enum:
          - new
          - name
          - until
          - activity
          default: new
        description: new = newest first, until = paid-until date (soonest first), activity = last activity first.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Items per page (max 100).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Salon'
                  page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 4
                  pages:
                    type: integer
                    example: 1
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
    post:
      tags:
      - Salons
      summary: Create a salon (and its owner)
      description: Same as wp-admin → Salons → Add New. Either `owner` (new owner account) or `owner_id` (branch of an existing owner). Optional
        `language`, `features`, `subscription` are applied right after; their problems come back in `warnings` (the salon is still created). Logged
        as "(iPhone app)".
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '201':
          description: Done
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SalonDetail'
                - type: object
                  properties:
                    login:
                      type: object
                      properties:
                        username:
                          type: string
                        password:
                          type: string
                          description: Shown ONCE. Show it with a "Send on WhatsApp" button; never store it.
                        login_url:
                          type: string
                        whatsapp_link:
                          type:
                          - string
                          - 'null'
                          description: wa.me link with the login message in the salon language.
                    warnings:
                      type: array
                      items:
                        type: string
        '400':
          description: Wrong data. data.field names the field to fix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '409':
          description: sm_user (username taken, field owner.username) or sm_email (email used, field owner.email).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                currency:
                  type: string
                  enum:
                  - USD
                  - LBP
                slug:
                  type: string
                  description: Web address part; empty = from the name
                notes:
                  type: string
                language:
                  type: string
                  enum:
                  - en
                  - ar
                owner:
                  type: object
                  properties:
                    username:
                      type: string
                      description: Letters, numbers, - _ . @
                    email:
                      type: string
                    name:
                      type: string
                      description: Shown name
                    password:
                      type: string
                      description: Optional, 8+ characters. Empty = a 12-character password is made.
                    phone:
                      type: string
                      description: 'Optional: where the WhatsApp login message goes (default: salon phone).'
                  required:
                  - username
                  - email
                owner_id:
                  type: integer
                  description: 'Instead of owner: make it a branch of this existing salon owner'
                features:
                  type: object
                  additionalProperties:
                    type: boolean
                  description: 'feature slug → on/off, e.g. {"wabot": true, "queue": false}. Slugs: GET /admin/features.'
                subscription:
                  type: object
                  properties:
                    plan_id:
                      type: integer
                      description: 0 = not billed
                    cycle:
                      type: string
                      enum:
                      - month
                      - year
                    until:
                      type: string
                      format: date
                      description: Paid until (YYYY-MM-DD)
                    price:
                      type:
                      - number
                      - 'null'
                      description: Own price per cycle; null = plan price
                    trial:
                      type: boolean
                    apply_features:
                      type: boolean
                      description: Switch the salon features to the plan features
  /admin/salons/{id}:
    get:
      tags:
      - Salons
      summary: One salon
      description: Everything about one salon.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Salons
      summary: Change a salon
      description: 'Send only what changes. Owner: `owner.email`, `owner.name`. The currency cannot change once the salon has money data (409
        sm_currency_locked).'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SalonDetail'
        '400':
          description: Wrong data. data.field names the field to fix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: sm_currency_locked or sm_email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                currency:
                  type: string
                  enum:
                  - USD
                  - LBP
                slug:
                  type: string
                notes:
                  type: string
                language:
                  type: string
                  enum:
                  - en
                  - ar
                owner:
                  type: object
                  properties:
                    email:
                      type: string
                    name:
                      type: string
    delete:
      tags:
      - Salons
      summary: Delete a salon and ALL its data
      description: 'Needs `confirm` = the salon name (any letter case), in the JSON body or as ?confirm=. Deletes the owner account too, unless
        he owns other branches. Cannot be undone: show a red screen where the user types the name. Kept in wp-admin''s list of deleted salons.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                  id:
                    type: integer
                  name:
                    type: string
                  rows:
                    type: integer
                    description: Rows of data deleted
                  message:
                    type: string
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '400':
          description: 'smapi_confirm: name does not match, nothing deleted.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                confirm:
                  type: string
              required:
              - confirm
  /admin/salons/{id}/users:
    get:
      tags:
      - Salons
      summary: Owner and team logins of a salon
      description: 'role: owner, staff or other. No passwords.'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/UserShort'
                      - type: object
                        properties:
                          role:
                            type: string
                            enum:
                            - owner
                            - staff
                            - other
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/salons/{id}/subscription:
    get:
      tags:
      - Billing
      summary: Subscription of a salon
      description: Plan, cycle, price, paid-until and the open (unpaid) invoice if any.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  salon_id:
                    type: integer
                  subscription:
                    anyOf:
                    - $ref: '#/components/schemas/Billing'
                    - type: 'null'
                  open_invoice:
                    anyOf:
                    - $ref: '#/components/schemas/Invoice'
                    - type: 'null'
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Billing
      summary: Set the subscription
      description: Same as wp-admin → Billing → salon. plan_id 0 = not billed.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '200':
          description: Done
          content:
            application/json:
              schema:
                type: object
                properties:
                  salon_id:
                    type: integer
                  subscription:
                    anyOf:
                    - $ref: '#/components/schemas/Billing'
                    - type: 'null'
                  open_invoice:
                    anyOf:
                    - $ref: '#/components/schemas/Invoice'
                    - type: 'null'
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '400':
          description: Wrong data. data.field names the field to fix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                plan_id:
                  type: integer
                  description: 0 = not billed
                cycle:
                  type: string
                  enum:
                  - month
                  - year
                until:
                  type: string
                  format: date
                  description: Paid until (YYYY-MM-DD)
                price:
                  type:
                  - number
                  - 'null'
                  description: Own price per cycle; null = plan price
                trial:
                  type: boolean
                apply_features:
                  type: boolean
                  description: Switch the salon features to the plan features
  /admin/owners:
    get:
      tags:
      - Salons
      summary: Owners with their salons
      description: ''
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Name, login or email.
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
        description: Page number.
      - name: per_page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 25
        description: Items per page (max 100).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      allOf:
                      - $ref: '#/components/schemas/UserShort'
                      - type: object
                        properties:
                          salons:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: integer
                                name:
                                  type: string
                                status:
                                  type: string
                  page:
                    type: integer
                    example: 1
                  per_page:
                    type: integer
                    example: 25
                  total:
                    type: integer
                    example: 4
                  pages:
                    type: integer
