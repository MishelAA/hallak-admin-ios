  /admin/leads/{id}/convert:
    post:
      tags:
      - Requests
      summary: Create the salon from a demo request
      description: Same body as POST /admin/salons; anything missing comes from the request (salon name, phone, owner name and email; a username
        is made from the name). The request becomes "done". Answer = POST /admin/salons + `lead`.
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: id
        in: path
        required: true
        schema:
          type: integer
          minimum: 1
      responses:
        '201':
          description: Done
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/SalonDetail'
                - type: object
                  properties:
                    login:
                      type: object
                      properties:
                        username:
                          type: string
                        password:
                          type: string
                          description: Shown ONCE. Show it with a "Send on WhatsApp" button; never store it.
                        login_url:
                          type: string
                        whatsapp_link:
                          type:
                          - string
                          - 'null'
                          description: wa.me link with the login message in the salon language.
                    warnings:
                      type: array
                      items:
                        type: string
                    lead:
                      $ref: '#/components/schemas/Lead'
        '400':
          description: Wrong data. data.field names the field to fix.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Username or email already used: send owner.username / owner.email.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                phone:
                  type: string
                address:
                  type: string
                currency:
                  type: string
                  enum:
                  - USD
                  - LBP
                slug:
                  type: string
                  description: Web address part; empty = from the name
                notes:
                  type: string
                language:
                  type: string
                  enum:
                  - en
                  - ar
                owner:
                  type: object
                  properties:
                    username:
                      type: string
                      description: Letters, numbers, - _ . @
                    email:
                      type: string
                    name:
                      type: string
                      description: Shown name
                    password:
                      type: string
                      description: Optional, 8+ characters. Empty = a 12-character password is made.
                    phone:
                      type: string
                      description: 'Optional: where the WhatsApp login message goes (default: salon phone).'
                  required:
                  - username
                  - email
                owner_id:
                  type: integer
                  description: 'Instead of owner: make it a branch of this existing salon owner'
                features:
                  type: object
                  additionalProperties:
                    type: boolean
                  description: 'feature slug → on/off, e.g. {"wabot": true, "queue": false}. Slugs: GET /admin/features.'
                subscription:
                  type: object
                  properties:
                    plan_id:
                      type: integer
                      description: 0 = not billed
                    cycle:
                      type: string
                      enum:
                      - month
                      - year
                    until:
                      type: string
                      format: date
                      description: Paid until (YYYY-MM-DD)
                    price:
                      type:
                      - number
                      - 'null'
                      description: Own price per cycle; null = plan price
                    trial:
                      type: boolean
                    apply_features:
                      type: boolean
                      description: Switch the salon features to the plan features
components:
  securitySchemes:
    appPassword:
      type: http
      scheme: basic
      description: username:application-password (WordPress → Users → Profile → Application Passwords). Spaces in the password are allowed.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - en
        - ar
        default: en
      description: Language of labels and error messages.
  responses:
    Unauthorized:
      description: 'Not logged in. Codes: smapi_no_auth_header (the header did not reach the server), invalid_username / smapi_login_user (unknown
        username), incorrect_password / smapi_login_password (not one of its Application Passwords), smapi_login_vars (Postman variables not filled),
        smapi_app_passwords_off, smapi_login (other: data.check lists yes/no what the server received).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Logged in but not an administrator (smapi_forbidden), or not https (smapi_https).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (smapi_not_found), or the plugin for it is not active (smapi_no_billing, smapi_no_site, smapi_no_whatsapp, smapi_no_ai).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: 'smapi_slow_down (more than 120 requests in a minute) or smapi_locked (too many wrong passwords: 15 minutes).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Money:
      type: object
      properties:
        amount:
          type: number
          example: 25.5
        currency:
          type: string
          example: USD
          description: USD or LBP. LBP amounts are whole numbers.
        display:
          type: string
          example: $25.50
          description: Ready to show.
      required:
      - amount
      - currency
      - display
    Error:
      type: object
      properties:
        code:
          type: string
          example: smapi_not_found
        message:
          type: string
          example: Salon not found.
          description: In the language of Accept-Language.
        data:
          type: object
          properties:
            status:
              type: integer
              example: 404
            field:
              type: string
              description: The field that is wrong, when there is one.
      required:
      - code
      - message
    Paging:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 4
        pages:
          type: integer
          example: 1
    UserShort:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        last_login:
          type:
          - string
          - 'null'
          example: 2026-11-17 09:12
    Billing:
      type: object
      properties:
        status:
          type: string
          enum:
          - free
          - trial
          - active
          - grace
          - overdue
          description: free = not billed, grace = payment due (still working), overdue = past the grace days.
        status_label:
          type: string
          example: Paid
        plan_id:
          type:
          - integer
          - 'null'
        plan:
          type:
          - string
          - 'null'
          example: Pro
        cycle:
          type: string
          enum:
          - month
          - year
        price:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        monthly:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        own_price:
          type: boolean
        until:
          type:
          - string
          - 'null'
          format: date
          example: '2026-12-07'
        days_left:
          type:
          - integer
          - 'null'
          example: 20
          description: Negative when the date has passed.
        grace_end:
          type:
          - string
          - 'null'
          format: date
        trial:
          type: boolean
    Salon:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: emmanuel-hairstyle
        name:
          type: string
          example: Emmanuel Hairstyle
        phone:
          type: string
        address:
          type: string
        currency:
          type: string
          enum:
          - USD
          - LBP
        language:
          type: string
          enum:
          - en
          - ar
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type:
          - string
          - 'null'
        last_activity:
          type:
          - string
          - 'null'
          description: Last line in the activity log.
        owner:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            username:
              type: string
            name:
              type: string
            email:
              type: string
        billing:
          anyOf:
          - $ref: '#/components/schemas/Billing'
          - type: 'null'
    SalonDetail:
      type: object
      properties:
        salon:
          allOf:
          - $ref: '#/components/schemas/Salon'
          - type: object
            properties:
              notes:
                type: string
              fx:
                type:
                - object
                - 'null'
                properties:
                  second:
                    type: string
                    example: LBP
                  rate:
                    type: number
                    example: 89500
        features:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              label:
                type: string
              'on':
                type: boolean
        links:
          type: object
          properties:
            dashboard:
              type:
              - string
              - 'null'
            page:
              type:
              - string
              - 'null'
            booking:
              type:
              - string
              - 'null'
            whatsapp:
              type:
              - string
              - 'null'
              description: wa.me link to the salon phone.
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        month:
          type: object
          properties:
            visits:
              type: integer
            revenue:
              $ref: '#/components/schemas/Money'
            customers:
              type:
              - integer
              - 'null'
        whatsapp:
          type: object
          properties:
            feature_on:
              type: boolean
            bot_on:
              type: boolean
            number_linked:
              type: boolean
            replies_month:
              type: integer
            limit:
              type: integer
              description: 0 = no limit
            own_limit:
              type: boolean
            chats_need_team:
              type: integer
            cost_month:
              $ref: '#/components/schemas/Money'
        ai:
          type: object
          properties:
            feature_on:
              type: boolean
            questions_month:
              type: integer
            limit:
              type: integer
            own_limit:
              type: boolean
            cost_month:
              $ref: '#/components/schemas/Money'
        generated_at:
          type: string
          example: 2026-11-17 22:45
          description: When the answer was made (Lebanon time).
        tz:
          type: string
          example: Asia/Beirut
    Invoice:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          example: HL-2026-0012
        salon_id:
          type: integer
        salon_name:
          type: string
        plan:
          type: string
        period_from:
          type:
          - string
          - 'null'
          format: date
        period_to:
          type:
          - string
          - 'null'
          format: date
        months:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        status:
