  /admin/login-link:
    post:
      tags:
      - Connection
      summary: One-time sign-in link (open a salon dashboard or wp-admin without logging in)
      description: 'Returns a link that works ONCE, for 2 minutes. Open it in the in-app browser (SFSafariViewController or ASWebAuthenticationSession
        / WKWebView): the website signs the super admin in there (normal WordPress cookie) and goes to the page. Ask for a new link every time
        the user taps; never store or share it. Only administrators get links. Opening is listed in wp-admin → Salons → iPhone app (API).'
      parameters:
      - $ref: '#/components/parameters/AcceptLanguage'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                salon_id:
                  type: integer
                  description: Open this salon. Without it, `to` chooses a platform page.
                tab:
                  type: string
                  description: 'With salon_id: dashboard tab: visits, customers, appointments, queue, staff, attendance, services, inventory,
                    expenses, prepaid, loyalty, messages, mypage, analytics, reports, assistant, whatsapp, branches, subscription, activity, settings,
                    account. Empty = Overview. A tab the salon does not have opens the Overview.'
                to:
                  type: string
                  enum:
                  - dashboard
                  - page
                  - booking
                  - wp-admin
                  - salons
                  - billing
                  - check
                  - site
                  description: 'With salon_id: dashboard (default), page (public salon page), booking (booking page). Without salon_id: wp-admin,
                    salons, billing, check (plugins check), site (home page, default).'
            examples:
              salon:
                value:
                  salon_id: 12
                  tab: appointments
              wpadmin:
                value:
                  to: wp-admin
      responses:
        '201':
          description: Link created
          content:
            application/json:
              schema:
                type: object
                properties:
                  url:
                    type: string
                    example: https://hallak.online/?hallak_open=3f9a…
                  expires_in:
                    type: integer
                    example: 120
                  opens:
                    type: string
                    description: The page it will open (for display).
                  generated_at:
                    type: string
                    example: 2026-11-17 22:45
                    description: When the answer was made (Lebanon time).
                  tz:
                    type: string
                    example: Asia/Beirut
        '400':
          description: 'smapi_bad_target: unknown `to`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooMany'
