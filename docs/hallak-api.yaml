components:
  securitySchemes:
    appPassword:
      type: http
      scheme: basic
      description: username:application-password (WordPress → Users → Profile → Application Passwords). Spaces in the password are allowed.
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      schema:
        type: string
        enum:
        - en
        - ar
        default: en
      description: Language of labels and error messages.
  responses:
    Unauthorized:
      description: 'Not logged in. Codes: smapi_no_auth_header (the header did not reach the server), smapi_login (wrong username or password).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Logged in but not an administrator (smapi_forbidden), or not https (smapi_https).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not found (smapi_not_found), or the plugin for it is not active (smapi_no_billing, smapi_no_site, smapi_no_whatsapp, smapi_no_ai).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooMany:
      description: 'smapi_slow_down (more than 120 requests in a minute) or smapi_locked (too many wrong passwords: 15 minutes).'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Money:
      type: object
      properties:
        amount:
          type: number
          example: 25.5
        currency:
          type: string
          example: USD
          description: USD or LBP. LBP amounts are whole numbers.
        display:
          type: string
          example: $25.50
          description: Ready to show.
      required:
      - amount
      - currency
      - display
    Error:
      type: object
      properties:
        code:
          type: string
          example: smapi_not_found
        message:
          type: string
          example: Salon not found.
          description: In the language of Accept-Language.
        data:
          type: object
          properties:
            status:
              type: integer
              example: 404
            field:
              type: string
              description: The field that is wrong, when there is one.
      required:
      - code
      - message
    Paging:
      type: object
      properties:
        page:
          type: integer
          example: 1
        per_page:
          type: integer
          example: 25
        total:
          type: integer
          example: 4
        pages:
          type: integer
          example: 1
    UserShort:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        name:
          type: string
        email:
          type: string
        last_login:
          type:
          - string
          - 'null'
          example: 2026-11-17 09:12
    Billing:
      type: object
      properties:
        status:
          type: string
          enum:
          - free
          - trial
          - active
          - grace
          - overdue
          description: free = not billed, grace = payment due (still working), overdue = past the grace days.
        status_label:
          type: string
          example: Paid
        plan_id:
          type:
          - integer
          - 'null'
        plan:
          type:
          - string
          - 'null'
          example: Pro
        cycle:
          type: string
          enum:
          - month
          - year
        price:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        monthly:
          anyOf:
          - $ref: '#/components/schemas/Money'
          - type: 'null'
        own_price:
          type: boolean
        until:
          type:
          - string
          - 'null'
          format: date
          example: '2026-12-07'
        days_left:
          type:
          - integer
          - 'null'
          example: 20
          description: Negative when the date has passed.
        grace_end:
          type:
          - string
          - 'null'
          format: date
        trial:
          type: boolean
    Salon:
      type: object
      properties:
        id:
          type: integer
          example: 1
        slug:
          type: string
          example: emmanuel-hairstyle
        name:
          type: string
          example: Emmanuel Hairstyle
        phone:
          type: string
        address:
          type: string
        currency:
          type: string
          enum:
          - USD
          - LBP
        language:
          type: string
          enum:
          - en
          - ar
        status:
          type: string
          enum:
          - active
          - suspended
        created_at:
          type:
          - string
          - 'null'
        last_activity:
          type:
          - string
          - 'null'
          description: Last line in the activity log.
        owner:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            username:
              type: string
            name:
              type: string
            email:
              type: string
        billing:
          anyOf:
          - $ref: '#/components/schemas/Billing'
          - type: 'null'
    SalonDetail:
      type: object
      properties:
        salon:
          allOf:
          - $ref: '#/components/schemas/Salon'
          - type: object
            properties:
              notes:
                type: string
              fx:
                type:
                - object
                - 'null'
                properties:
                  second:
                    type: string
                    example: LBP
                  rate:
                    type: number
                    example: 89500
        features:
          type: array
          items:
            type: object
            properties:
              slug:
                type: string
              label:
                type: string
              'on':
                type: boolean
        links:
          type: object
          properties:
            dashboard:
              type:
              - string
              - 'null'
            page:
              type:
              - string
              - 'null'
            booking:
              type:
              - string
              - 'null'
            whatsapp:
              type:
              - string
              - 'null'
              description: wa.me link to the salon phone.
        invoices:
          type: array
          items:
            $ref: '#/components/schemas/Invoice'
        month:
          type: object
          properties:
            visits:
              type: integer
            revenue:
              $ref: '#/components/schemas/Money'
            customers:
              type:
              - integer
              - 'null'
        whatsapp:
          type: object
          properties:
            feature_on:
              type: boolean
            bot_on:
              type: boolean
            number_linked:
              type: boolean
            replies_month:
              type: integer
            limit:
              type: integer
              description: 0 = no limit
            own_limit:
              type: boolean
            chats_need_team:
              type: integer
            cost_month:
              $ref: '#/components/schemas/Money'
        ai:
          type: object
          properties:
            feature_on:
              type: boolean
            questions_month:
              type: integer
            limit:
              type: integer
            own_limit:
              type: boolean
            cost_month:
              $ref: '#/components/schemas/Money'
        generated_at:
          type: string
          example: 2026-11-17 22:45
          description: When the answer was made (Lebanon time).
        tz:
          type: string
          example: Asia/Beirut
    Invoice:
      type: object
      properties:
        id:
          type: integer
        number:
          type: string
          example: HL-2026-0012
        salon_id:
          type: integer
        salon_name:
          type: string
        plan:
          type: string
        period_from:
          type:
          - string
          - 'null'
          format: date
        period_to:
          type:
          - string
          - 'null'
          format: date
        months:
          type: integer
        amount:
          $ref: '#/components/schemas/Money'
        status:
          type: string
          enum:
          - unpaid
          - paid
          - void
        method:
          type:
          - string
          - 'null'
          enum:
          - cash
          - whish
          - omt
          - bank
          - other
          - null
        method_label:
          type:
          - string
          - 'null'
        paid_at:
          type:
          - string
          - 'null'
        note:
          type: string
        created_at:
          type:
          - string
          - 'null'
    Plan:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        price_month:
          $ref: '#/components/schemas/Money'
        price_year:
          $ref: '#/components/schemas/Money'
        features:
          type: array
          items:
            type: string
            description: Feature slug, see /admin/features
        note:
          type: string
        active:
          type: boolean
    Lead:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        salon:
          type: string
        phone:
          type: string
        email:
          type: string
        plan:
          type: string
        barbers:
          type: string
        message:
          type: string
        status:
          type: string
          enum:
          - new
          - done
        created_at:
          type:
          - string
          - 'null'
        whatsapp:
          type:
          - string
          - 'null'
          example: https://wa.me/96176123456
    Activity:
      type: object
      properties:
        id:
          type: integer
        salon_id:
          type: integer
        salon_name:
          type:
          - string
          - 'null'
        action:
          type: string
          example: appointment_online
        summary:
          type: string
        object_type:
          type:
          - string
          - 'null'
        object_id:
          type:
          - integer
          - 'null'
        by:
          type:
          - object
          - 'null'
          properties:
            id:
              type: integer
            name:
              type: string
        details:
          type:
          - object
          - 'null'
        at:
          type:
          - string
          - 'null'
    Overview:
      type: object
      properties:
        salons:
          type: object
          properties:
            total:
              type: integer
            active:
              type: integer
            suspended:
              type: integer
        billing:
          type: object
          properties:
            free:
              type: integer
            trial:
              type: integer
            active:
              type: integer
            grace:
              type: integer
            overdue:
              type: integer
        money:
          type: object
          properties:
            mrr:
              $ref: '#/components/schemas/Money'
            paid_this_month:
              $ref: '#/components/schemas/Money'
            unpaid:
              type: object
              properties:
                count:
                  type: integer
                amount:
                  $ref: '#/components/schemas/Money'
        leads:
          type: object
          properties:
            new:
              type: integer
        whatsapp:
          type: object
          properties:
            replies_month:
              type: integer
            cost_month:
              $ref: '#/components/schemas/Money'
            chats_need_team:
              type: integer
        ai:
          type: object
          properties:
            questions_month:
              type: integer
            summaries_month:
              type: integer
            cost_month:
              $ref: '#/components/schemas/Money'
        health:
          type: object
          properties:
            errors:
              type: integer
            warnings:
              type: integer
        activity_today:
          type: integer
        generated_at:
          type: string
          example: 2026-11-17 22:45
          description: When the answer was made (Lebanon time).
        tz:
          type: string
          example: Asia/Beirut
