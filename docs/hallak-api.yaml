          - paid
          - void
        method:
          type:
          - string
          - 'null'
          enum:
          - cash
          - whish
          - omt
          - bank
          - other
          - null
        method_label:
          type:
          - string
          - 'null'
        paid_at:
          type:
          - string
          - 'null'
        note:
          type: string
        created_at:
          type:
          - string
          - 'null'
    Plan:
