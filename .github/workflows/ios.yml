name: iOS

# Push to main or run by hand (Actions → iOS → Run workflow).
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # TestFlight runs only when these secrets exist (see README).
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Generate the Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Unit tests (iPhone simulator)
        run: |
          UDID=$(bash scripts/pick_simulator.sh)
          echo "SIM_UDID=$UDID" >> "$GITHUB_ENV"
          set +e
          xcodebuild test -project HallakAdmin.xcodeproj -scheme HallakAdmin \
            -destination "id=$UDID" -resultBundlePath TestResults.xcresult \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY="-" DEVELOPMENT_TEAM="" > test.log 2>&1
          STATUS=$?
          set -e
          grep -E "error:|Test Case .* failed|Executed [0-9]+ test" test.log | head -80 || true
          tail -25 test.log
          exit $STATUS

      - name: Screenshot of the app
        continue-on-error: true
        run: |
          xcrun simctl bootstatus "$SIM_UDID" -b
          mkdir -p screenshots
          shot () { # name, then launch arguments
            NAME=$1; shift
            xcrun simctl terminate "$SIM_UDID" online.hallak.admin 2>/dev/null || true
            xcrun simctl launch "$SIM_UDID" online.hallak.admin "$@"
            sleep 5
            xcrun simctl io "$SIM_UDID" screenshot "screenshots/$NAME.png"
          }
          # Demo mode (Debug build only): the app runs on the test answers, no real login.
          demo () { # name, language, tab, route
            shot "$1" -AppleLanguages "($2)" -AppleLocale "$2_LB" -HallakDemo YES -HallakTab "$3" -HallakRoute "$4"
          }
          xcrun simctl ui "$SIM_UDID" appearance light
          shot login-en-light -AppleLanguages "(en)" -AppleLocale en_LB
          shot login-ar-light -AppleLanguages "(ar)" -AppleLocale ar_LB
          for s in "home home none" "salons salons none" "salon salons salon" "money money none" "invoice money invoice" \
                   "requests requests none" "lead requests lead" "more more none" "health more health" \
                   "owners more owners" "whatsapp more whatsapp" "ai more ai" "activity more activity" "settings more settings" \
                   "web salons web" "plan more plan" "demos more demos"; do
            set -- $s
            demo "en-light-$1" en "$2" "$3"
          done
          for s in "home home none" "salons salons none" "salon salons salon" "money money none" "health more health" "settings more settings" "plan more plan" "demos more demos"; do
            set -- $s
            demo "ar-light-$1" ar "$2" "$3"
          done
          xcrun simctl ui "$SIM_UDID" content_size accessibility-extra-large
          demo en-light-home-xxl en home none
          xcrun simctl ui "$SIM_UDID" content_size large
          xcrun simctl ui "$SIM_UDID" appearance dark
          shot login-en-dark -AppleLanguages "(en)" -AppleLocale en_LB
          for s in "home home none" "salon salons salon" "money money none" "requests requests none" "plan more plan"; do
            set -- $s
            demo "en-dark-$1" en "$2" "$3"
          done

      - name: Build unsigned IPA (for sideloading)
        run: |
          set -o pipefail
          xcodebuild -project HallakAdmin.xcodeproj -scheme HallakAdmin -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            build > build.log 2>&1 || { grep -E "error:" build.log | head -50; tail -40 build.log; exit 1; }
          mkdir -p Payload dist
          cp -R build/Build/Products/Release-iphoneos/HallakAdmin.app Payload/
          zip -qry dist/HallakAdmin-unsigned.ipa Payload
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: HallakAdmin-ipa
          path: dist/HallakAdmin-unsigned.ipa

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-and-logs
          path: |
            screenshots/
            test.log
            build.log
          if-no-files-found: ignore

      - name: TestFlight (only when the App Store Connect secrets are set)
        if: env.ASC_KEY_ID != '' && env.ASC_ISSUER_ID != '' && env.ASC_KEY_P8 != '' && env.APPLE_TEAM_ID != ''
        run: fastlane beta
